services:
  todo:
    image: "todo"
    build:
      context: ./todo
      dockerfile: Dockerfile.todo
    depends_on:
      - todo-migrator
      - todo-db
    ports:
      - 44044:8080
    command: ["-config=${CONFIG_TODO_PATH}"]
    volumes:
      - ./configs:/configs:ro
  todo-migrator:
    image: migrator
    build:
      context: ./todo
      dockerfile: Dockerfile.migrator
    depends_on:
      - todo-db
    restart: "no"
    command: ["-p=${DB_TODO_PASSWORD}", "-m=${MIGRATIONS_PATH}", "-n=${DB_TODO_NAME}", "-u=${DB_TODO_USER}", "-h=${DB_TODO_HOST}"]
    volumes:
     - ./migrations/todo:/app/migrations
  todo-db:
    image: postgres:latest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_TODO_USER} -d ${DB_TODO_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${DB_TODO_PASSWORD}
      POSTGRES_USER: ${DB_TODO_USER}
      POSTGRES_DB: ${DB_TODO_NAME}
    ports:
      - 44045:5432
    volumes:
      - todo-db:/var/lib/postgresql/data
volumes:
  todo-db: