services:
  todo:
    image: "todo"
    build:
      context: ./todo
      dockerfile: Dockerfile.todo
    # depends_on:
    #   - migrator-todo
    #   - db-todo
    ports:
      - 44044:8080
    command: ["-config=${CONFIG_PATH}"]
  migrator-todo:
    image: migrator
    build:
      context: ./todo
      dockerfile: Dockerfile.migrator
    depends_on:
      - db-todo
    restart: "no"
    command: ["-p=${DB_PASSWORD}", "-m=${MIGRATIONS_PATH}", "-n=${DB_NAME}", "-u=${DB_USER}"]
    volumes:
     - ./migrations:/app/migrations
  db-todo:
    image: postgres:latest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 44045:5432
    volumes:
      - db-todo:/var/lib/postgresql/data
volumes:
  db-todo: